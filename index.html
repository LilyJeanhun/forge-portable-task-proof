<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portable Task Proof</title>
  <style>
    :root {
      --bg: #121316;
      --card: #191c21;
      --card-hover: #20242b;
      --border: #292f39;
      --border-focus: #3ef0b5;
      --text: #e6e8eb;
      --text-muted: #8b94a0;
      --mint: #3ef0b5;
      --mint-glow: rgba(62, 240, 181, 0.22);
      --danger: #f87171;
      --danger-hover: rgba(248, 113, 113, 0.16);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .status-text {
      font-size: 0.75rem;
      color: var(--mint);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    canvas#status-canvas {
      border: 1px solid var(--border);
      background: #14171c;
      border-radius: 6px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    label[for="task-input"] {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--mint-glow);
    }
    button {
      font-family: inherit;
      cursor: pointer;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .btn-add {
      background: var(--mint);
      color: #0b291e;
      padding: 0 1.25rem;
      font-size: 0.9rem;
    }
    .btn-add:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 12px var(--mint-glow);
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 1.8rem;
      padding: 0 0.2rem;
    }
    .task-tally {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 0.3rem 0.65rem;
    }
    .btn-clear:not(:disabled):hover {
      color: var(--text);
      border-color: #3e4654;
      background: var(--card);
    }
    .btn-clear:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    ul#task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .task-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .task-item:hover {
      background: var(--card-hover);
      border-color: #3b424e;
    }
    .task-title {
      flex: 1;
      font-size: 0.95rem;
      word-break: break-word;
      line-height: 1.4;
    }
    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .task-item.completed {
      border-color: #1f302b;
      background: #141a18;
    }
    .actions {
      display: flex;
      gap: 0.4rem;
    }
    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
    }
    .btn-action.complete {
      color: var(--mint);
      border-color: rgba(62, 240, 181, 0.35);
    }
    .btn-action.complete:hover {
      background: var(--mint-glow);
    }
    .btn-action.delete {
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.35);
    }
    .btn-action.delete:hover {
      background: var(--danger-hover);
    }
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>Portable Task Proof</h1>
        <span class="status-text" id="status-label">Synchronized</span>
      </div>
      <canvas id="status-canvas" width="100" height="36" aria-label="Task telemetry"></canvas>
    </header>

    <form id="task-form">
      <label for="task-input">Task</label>
      <div class="input-row">
        <input id="task-input" type="text" placeholder="Enter task narrative..." autocomplete="off" required />
        <button type="submit" class="btn-add">Add task</button>
      </div>
    </form>

    <div class="toolbar">
      <span class="task-tally" id="task-tally">0 tasks</span>
      <button id="clear-btn" class="btn-clear" type="button" disabled>Clear completed</button>
    </div>

    <ul id="task-list" aria-live="polite"></ul>
  </div>

  <script>
    const STORAGE_KEY = 'ptp_tasks_data';
    let tasks = [];

    const taskForm = document.getElementById('task-form');
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');
    const taskTally = document.getElementById('task-tally');
    const clearBtn = document.getElementById('clear-btn');
    const statusLabel = document.getElementById('status-label');
    const canvas = document.getElementById('status-canvas');
    const ctx = canvas.getContext('2d');

    let waveOffset = 0;

    function loadTasks() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        tasks = stored ? JSON.parse(stored) : [];
      } catch (err) {
        tasks = [];
      }
      render();
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (err) {}
      render();
    }

    function addTask(text) {
      tasks.push({
        id: Date.now().toString(36) + Math.random().toString(36).substring(2, 6),
        text: text.trim(),
        completed: false
      });
      saveTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
    }

    function render() {
      taskList.innerHTML = '';
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;

      clearBtn.disabled = completed === 0;
      clearBtn.textContent = completed > 0 ? `Clear completed (${completed})` : 'Clear completed';
      taskTally.textContent = `${total} ${total === 1 ? 'task' : 'tasks'}${completed > 0 ? ` • ${completed} done` : ''}`;

      if (total === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-state';
        empty.textContent = 'No tasks active. Add one to generate verification trace.';
        taskList.appendChild(empty);
      } else {
        tasks.forEach(task => {
          const li = document.createElement('li');
          li.className = `task-item ${task.completed ? 'completed' : ''}`;

          const span = document.createElement('span');
          span.className = 'task-title';
          span.textContent = task.text;

          const actions = document.createElement('div');
          actions.className = 'actions';

          const compBtn = document.createElement('button');
          compBtn.className = 'btn-action complete';
          compBtn.textContent = task.completed ? 'Undo' : 'Complete';
          compBtn.onclick = () => toggleTask(task.id);

          const delBtn = document.createElement('button');
          delBtn.className = 'btn-action delete';
          delBtn.textContent = 'Delete';
          delBtn.onclick = () => deleteTask(task.id);

          actions.appendChild(compBtn);
          actions.appendChild(delBtn);
          li.appendChild(span);
          li.appendChild(actions);
          taskList.appendChild(li);
        });
      }

      statusLabel.textContent = total === 0 ? 'Idle' : `${completed}/${total} Verified`;
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const ratio = total === 0 ? 0.2 : completed / total;

      ctx.fillStyle = '#181e1c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      for (let x = 0; x <= canvas.width; x += 2) {
        const frequency = 0.08;
        const amplitude = 3 + ratio * 8;
        const y = canvas.height * 0.5 + Math.sin(x * frequency + waveOffset) * amplitude;
        ctx.lineTo(x, y);
      }
      ctx.strokeStyle = '#3ef0b5';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#3ef0b5';
      ctx.shadowBlur = 6;
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#3ef0b5';
      ctx.fillRect(4, canvas.height - 4, (canvas.width - 8) * (total === 0 ? 0 : ratio), 2);

      waveOffset += 0.04;
      requestAnimationFrame(animateCanvas);
    }

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (text) {
        addTask(text);
        taskInput.value = '';
      }
    });

    clearBtn.addEventListener('click', clearCompleted);

    loadTasks();
    animateCanvas();
  </script>
</body>
</html>
